[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-telemetry-analyzer"
version = "1.0.0"
description = "Diagnostics, calibration, and Grafana export tools for vehicle telemetry replay"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "opencv-python>=4.10",
]

[tool.setuptools.packages.find]
where = ["python"]
